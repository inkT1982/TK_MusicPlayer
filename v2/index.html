<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../AppIcon.png?v=2">
<title>TK-100 Compact Disc Player</title>

<!-- Shared styles (no colours — structure only) -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">

<!-- Skin: all colours, gradients and shadows live in one file. Swap this href to change the look. -->
<link rel="stylesheet" href="css/skins/default.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
</head>
<body>
<main class="deck">
  <div class="top">
    <div class="brand-badge">
      <div class="brand-dot" id="power-led"></div>
      <span>TK-100</span>
    </div>
    <div class="top-actions">
      <button class="mini" id="tv-mode" aria-pressed="false">TV Mode</button>
      <button class="mini" id="lib-toggle" aria-expanded="false">Library</button>
    </div>
  </div>

  <div class="well">
    <div class="disc empty" id="disc">
      <div class="disc-rotor" id="disc-rotor">
        <img class="cover-art" id="disc-art" alt="Album Cover">
        <div class="lab" id="lab"></div>
        <div class="hub"></div>
      </div>
      <div class="well-shadow"></div>
    </div>
  </div>

  <div class="lcd">
    <div class="row1"><span id="trk">T--/--</span><span id="time">--:--</span></div>
    <div class="row2" id="msg">Connect Dropbox to read your library</div>
  </div>

  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek" disabled>

  <div class="btns">
    <button class="btn" id="prev" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="btn big" id="pp" aria-label="Play"><svg viewBox="0 0 24 24" id="ppi"><path d="M7 4v16l13-8z"/></svg></button>
    <button class="btn" id="next" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button class="btn" id="stop" aria-label="Stop"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
  </div>

  <div class="tools">
    <button class="mini" id="shuf" aria-pressed="false" aria-label="Shuffle" title="Shuffle">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
    </button>
    <button class="mini" id="rep" aria-pressed="false" aria-label="Repeat: Off" title="Repeat: Off">
      <svg viewBox="0 0 24 24" width="14" height="14" id="rep-icon" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    </button>
    <button class="mini" id="eject" aria-label="Eject" title="Eject">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M5 17h14v2H5zM12 5l7 9H5z"/></svg>
    </button>
  </div>

  <section class="lib" id="lib"></section>

  <div class="copyright-footer">&copy; TK-100 Digital Audio. All rights reserved.</div>
</main>

<audio id="a" preload="auto" playsinline></audio>

<!-- Scripts: classic scripts sharing one global scope, so ORDER MATTERS. -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/dropbox.js"></script>
<script src="js/auth.js"></script>
<script src="js/artwork.js"></script>
<script src="js/media-session.js"></script>
<script src="js/disc.js"></script>
<script src="js/tray.js"></script>
<script src="js/library.js"></script>
<script src="js/player.js"></script>
<script src="js/controls.js"></script>
<script src="js/main.js"></script>
</body>
</html>
