<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TK-100 Compact Disc Player</title>
<style>
  :root {
    --chassis-bg: #18181a;
    --chassis-top: #232326;
    --chassis-border: #323236;
    --well-bg: #0c0c0e;
    --oled-bg: #070809;
    --oled-amber: #ff9d3b;
    --oled-dim: #73471b;
    --braun-orange: #ff5a1f;
    --braun-orange-dark: #c93b08;
    --btn-surface: #26262a;
    --btn-highlight: #36363b;
    --text-main: #f2f2f5;
    --text-muted: #8e8e96;
    --radius-deck: 24px;
    --radius-btn: 12px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #242429 0%, #0d0d0f 75%);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.4;
    padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Main Deck Enclosure */
  .deck {
    width: 100%;
    max-width: 440px;
    border-radius: var(--radius-deck);
    padding: 20px;
    background: linear-gradient(175deg, var(--chassis-top) 0%, var(--chassis-bg) 45%, #121214 100%);
    border: 1px solid var(--chassis-border);
    box-shadow:
      0 28px 60px rgba(0, 0, 0, 0.75),
      0 4px 12px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.12),
      inset 0 -2px 0 rgba(0, 0, 0, 0.8);
  }

  /* Industrial Header */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    padding: 0 2px;
  }

  .brand-badge {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--braun-orange);
    box-shadow: 0 0 8px rgba(255, 90, 31, 0.7);
  }

  .top span {
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.14em;
    color: var(--text-main);
  }

  .top small {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* Optical Disc Bay */
  .well {
    position: relative;
    background: var(--well-bg);
    border-radius: 50%;
    padding: 10px;
    width: 82%;
    max-width: 280px;
    margin: 0 auto 20px;
    box-shadow:
      inset 0 8px 20px rgba(0, 0, 0, 0.95),
      inset 0 0 0 2px #050506,
      0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .disc {
    position: relative;
    aspect-ratio: 1;
    border-radius: 50%;
    animation: spin 2.6s linear infinite paused;
    background:
      radial-gradient(circle at center, transparent 28%, rgba(255, 255, 255, 0.04) 29%, transparent 30%, rgba(255, 255, 255, 0.03) 45%, transparent 46%, rgba(255, 255, 255, 0.04) 62%, transparent 63%),
      conic-gradient(
        from 35deg,
        #c8ced6 0deg,
        #7d8590 45deg,
        #e2e8f0 90deg,
        #64748b 135deg,
        #cbd5e1 180deg,
        #475569 225deg,
        #f1f5f9 270deg,
        #64748b 315deg,
        #c8ced6 360deg
      );
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.85), inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    transition: filter 0.35s ease, opacity 0.35s ease;
  }

  /* Iridescent Optical Sheen */
  .disc::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(
      from 15deg,
      transparent 0%,
      rgba(125, 211, 252, 0.35) 12%,
      rgba(244, 114, 182, 0.3) 18%,
      rgba(253, 224, 71, 0.3) 24%,
      transparent 34%,
      transparent 52%,
      rgba(167, 139, 250, 0.32) 64%,
      rgba(56, 189, 248, 0.35) 72%,
      transparent 82%
    );
    mix-blend-mode: screen;
    pointer-events: none;
  }

  .disc.on {
    animation-play-state: running;
  }

  .disc.empty {
    filter: grayscale(1) brightness(0.28);
    opacity: 0.7;
  }

  /* Disc Center Label */
  .lab {
    position: absolute;
    z-index: 1;
    inset: 28%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #27272b, #141416);
    color: var(--text-main);
    display: grid;
    place-items: center;
    text-align: center;
    padding: 16%;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    line-height: 1.2;
    overflow: hidden;
    word-break: break-word;
    box-shadow:
      0 0 0 2px rgba(255, 255, 255, 0.14),
      inset 0 1px 3px rgba(0, 0, 0, 0.8);
  }

  /* Magnetic Spindle Hub */
  .hub {
    position: absolute;
    z-index: 2;
    inset: 43%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #3a3a40, #0d0d0f);
    box-shadow:
      0 0 0 3px #1c1c1f,
      0 0 0 4px rgba(255, 255, 255, 0.15),
      0 3px 6px rgba(0, 0, 0, 0.9);
  }

  .hub::after {
    content: "";
    position: absolute;
    inset: 34%;
    border-radius: 50%;
    background: #050506;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .disc { animation: none; }
  }

  /* OLED Telemetry Screen */
  .lcd {
    background: var(--oled-bg);
    color: var(--oled-amber);
    border-radius: 14px;
    padding: 12px 16px;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    border: 1px solid #29292e;
    box-shadow:
      inset 0 4px 14px rgba(0, 0, 0, 0.95),
      0 1px 0 rgba(255, 255, 255, 0.06);
    margin-bottom: 14px;
  }

  .row1 {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .row1 span:first-child {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--oled-dim);
  }

  .row1 span:last-child {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1;
    text-shadow: 0 0 14px rgba(255, 157, 59, 0.45);
    font-variant-numeric: tabular-nums;
  }

  .row2 {
    font-size: 12px;
    color: #e5b887;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-height: 1.4em;
    letter-spacing: 0.02em;
  }

  /* Precision Scrubber */
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: #0c0c0e;
    border: 1px solid #2b2b30;
    margin: 4px 0 18px;
    cursor: pointer;
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.9);
  }

  input[type=range]:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffffff, #cbd5e1);
    border: 2px solid #18181a;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.25);
    transition: transform 0.12s ease;
  }

  input[type=range]:not(:disabled)::-webkit-slider-thumb:hover {
    transform: scale(1.12);
  }

  input[type=range]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffffff, #cbd5e1);
    border: 2px solid #18181a;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
  }

  /* Tactile Transport Deck */
  .btns {
    display: grid;
    grid-template-columns: 1fr 1.35fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }

  .btn {
    height: 50px;
    border-radius: var(--radius-btn);
    border: 1px solid #38383e;
    background: linear-gradient(180deg, var(--btn-highlight) 0%, var(--btn-surface) 100%);
    box-shadow:
      0 4px 0 #0d0d0f,
      0 8px 14px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.14);
    display: grid;
    place-items: center;
    color: var(--text-main);
    cursor: pointer;
    padding: 0;
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
  }

  .btn:hover {
    background: linear-gradient(180deg, #404046 0%, #2c2c30 100%);
  }

  .btn:active {
    transform: translateY(3px);
    box-shadow:
      0 1px 0 #0d0d0f,
      0 3px 6px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  /* Signature Braun Play/Pause Accent Button */
  .btn.big {
    background: linear-gradient(180deg, #ff703d 0%, var(--braun-orange) 100%);
    border-color: #ff8c61;
    color: #ffffff;
    box-shadow:
      0 4px 0 #8a2603,
      0 8px 16px rgba(255, 90, 31, 0.28),
      inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }

  .btn.big:hover {
    background: linear-gradient(180deg, #ff7d4f 0%, #ff6229 100%);
  }

  .btn.big:active {
    box-shadow:
      0 1px 0 #8a2603,
      0 3px 8px rgba(255, 90, 31, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  .btn svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  .btn:focus-visible,
  .row:focus-visible,
  .mini:focus-visible,
  input:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--braun-orange);
    outline-offset: 2px;
  }

  /* Utility Switches */
  .tools {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 4px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }

  .mini {
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    border: 1px solid #323236;
    background: #1d1d20;
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    color: var(--text-muted);
    display: inline-flex;
    gap: 8px;
    align-items: center;
    transition: all 0.15s ease;
  }

  .mini:hover {
    color: var(--text-main);
    border-color: #46464c;
    background: #242428;
  }

  .led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #424248;
    transition: all 0.2s ease;
  }

  .mini[aria-pressed=true] {
    color: var(--text-main);
    border-color: rgba(255, 90, 31, 0.5);
    background: rgba(255, 90, 31, 0.1);
  }

  .mini[aria-pressed=true] .led {
    background: var(--braun-orange);
    box-shadow: 0 0 8px var(--braun-orange);
  }

  /* Disc Library Drawer */
  .lib {
    width: 100%;
    max-width: 440px;
    margin: 14px auto 0;
    background: #141416;
    border: 1px solid #2a2a2e;
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
  }

  .lib h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin: 0 0 12px;
    font-weight: 700;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .row {
    padding: 11px 12px;
    border-radius: 10px;
    margin-bottom: 4px;
    cursor: pointer;
    display: flex;
    gap: 12px;
    align-items: center;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .row:hover {
    background: #1f1f23;
  }

  .row.cur {
    background: rgba(255, 90, 31, 0.14);
    border: 1px solid rgba(255, 90, 31, 0.35);
    font-weight: 600;
    color: #ffffff;
  }

  .row.cur i {
    color: var(--braun-orange);
  }

  .row i {
    font-style: normal;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: var(--text-muted);
    width: 1.8em;
    flex: none;
  }

  .row span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Authentication Form Styling */
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin: 10px 0 5px;
  }

  input:not([type=range]), select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #323236;
    border-radius: 10px;
    font: inherit;
    background: #0d0d0f;
    color: var(--text-main);
    transition: border-color 0.15s ease;
  }

  input:not([type=range]):focus, select:focus {
    border-color: var(--braun-orange);
  }

  .lib button.go {
    margin-top: 16px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(180deg, #ff703d 0%, var(--braun-orange) 100%);
    color: #ffffff;
    font: inherit;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255, 90, 31, 0.3);
    transition: filter 0.15s ease, transform 0.08s ease;
  }

  .lib button.go:hover {
    filter: brightness(1.08);
  }

  .lib button.go:active {
    transform: translateY(1px);
  }

  .note {
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.5;
    margin: 12px 0 0;
  }
</style>
</head>
<body>
<main class="deck">
  <div class="top">
    <div class="brand-badge">
      <div class="brand-dot" id="power-led"></div>
      <span>TK-100</span>
    </div>
    <small>Compact Disc Digital Audio</small>
  </div>
  <div class="well">
    <div class="disc empty" id="disc">
      <div class="lab" id="lab">No disc</div>
      <div class="hub"></div>
    </div>
  </div>
  <div class="lcd">
    <div class="row1"><span id="trk">T--/--</span><span id="time">--:--</span></div>
    <div class="row2" id="msg">Connect Dropbox to read your library</div>
  </div>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek" disabled>
  <div class="btns">
    <button class="btn" id="prev" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="btn big" id="pp" aria-label="Play"><svg viewBox="0 0 24 24" id="ppi"><path d="M7 4v16l13-8z"/></svg></button>
    <button class="btn" id="next" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button class="btn" id="stop" aria-label="Stop"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
  </div>
  <div class="tools">
    <button class="mini" id="shuf" aria-pressed="false"><span class="led"></span>Shuffle</button>
    <button class="mini" id="eject"><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M5 17h14v2H5zM12 5l7 9H5z"/></svg>Eject</button>
  </div>
</main>

<section class="lib" id="lib"></section>
<audio id="a" preload="auto"></audio>

<script>
const $=s=>document.querySelector(s);
const A=$('#a'),SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
const IC={play:'<path d="M7 4v16l13-8z"/>',pause:'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>'};
let S=null,stack=[{path:'',name:'Library'}],view=[],tracks=[],disc='',idx=-1,shuffle=false,unlocked=false;

const save=v=>{try{v?localStorage.setItem('tk_dbx_auth',JSON.stringify(v)):localStorage.removeItem('tk_dbx_auth')}catch(e){}};
const load=()=>{try{return JSON.parse(localStorage.getItem('tk_dbx_auth'))}catch(e){return null}};
const fmt=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'--:--';
const pad=n=>String(n).padStart(2,'0');
const say=t=>$('#msg').textContent=t;
const isAudio=f=>f['.tag']==='file'&&/\.(mp3|flac|m4a|aac|wav|ogg)$/i.test(f.name);
const clean=n=>n.replace(/\.[^.]+$/,'');

function updateSeekFill(){
  const el=$('#seek');
  const pct=(el.value/el.max)*100;
  el.style.background=el.disabled?'#0c0c0e':`linear-gradient(90deg, var(--braun-orange) ${pct}%, #0c0c0e ${pct}%)`;
}

async function api(method,params){
  const res=await fetch(`https://api.dropboxapi.com/2/${method}`,{
    method:'POST',
    headers:{
      'Authorization':`Bearer ${S.token}`,
      'Content-Type':'application/json'
    },
    body:JSON.stringify(params)
  });
  if(!res.ok){
    if(res.status===401){
      S=null;save(null);showLogin('Session expired or invalid token. Sign in again.');
    }
    const rawText=await res.text();
    let msg=rawText;
    try{
      const errJson=JSON.parse(rawText);
      msg=errJson.error_summary||errJson.user_message||rawText;
    }catch(e){}
    throw new Error(msg||`Dropbox HTTP ${res.status}`);
  }
  return await res.json();
}

function showLogin(note){
  $('#lib').innerHTML=`<h2>Connect to Dropbox</h2>
  <label for="tok">Access Token</label>
  <input id="tok" type="password" placeholder="Paste your Dropbox access token" autocomplete="off">
  <button class="go" id="login">Connect Dropbox</button>
  <p class="note">${note||'Generate an access token in the Dropbox App Console (requires Full Dropbox access and files.metadata.read + files.content.read permissions). Stored locally on this device.'}</p>`;
  $('#login').onclick=()=>{
    const t=$('#tok').value.trim();
    if(!t){say('Enter a valid access token');return}
    S={token:t};
    save(S);
    stack=[{path:'',name:'Library'},{path:'/music',name:'Music'}];
    openFolder('/music');
  };
}

async function openFolder(path){
  say('Reading…');
  try{
    let j=await api('files/list_folder',{path:path,recursive:false,include_mounted_folders:true});
    let entries=j.entries||[];
    while(j.has_more&&j.cursor){
      j=await api('files/list_folder/continue',{cursor:j.cursor});
      entries=entries.concat(j.entries||[]);
    }
    view=entries
      .filter(f=>f['.tag']==='folder'||isAudio(f))
      .sort((a,b)=>((b['.tag']==='folder'?1:0)-(a['.tag']==='folder'?1:0))||a.name.localeCompare(b.name,undefined,{numeric:true}));
    say(tracks.length?clean(cur().name):'Choose a disc');
    drawLib();
  }catch(e){
    say('Error: ' + e.message);
    showLogin('Connection failed: ' + e.message + '. Please check your token and try again.');
  }
}

function drawLib(){
  const lib=$('#lib');
  lib.innerHTML=`<h2>${stack.length===1&&!tracks.length?'Choose a disc':stack.map(s=>s.name).join(' / ')}</h2>`;
  if(stack.length>1)lib.append(row('↑','Back',()=>{stack.pop();openFolder(stack[stack.length-1].path)}));
  const files=view.filter(f=>f['.tag']==='file');
  view.forEach(f=>{
    if(f['.tag']==='folder'){
      lib.append(row('▸',f.name,()=>{stack.push({path:f.path_lower,name:f.name});openFolder(f.path_lower)}));
    }else{
      const n=files.indexOf(f);
      const r=row(pad(n+1),clean(f.name),()=>{tracks=files;disc=stack[stack.length-1].name;idx=n;playIdx(n)});
      if(tracks===files&&idx===n)r.classList.add('cur');
      lib.append(r);
    }
  });
  if(!view.length)lib.insertAdjacentHTML('beforeend','<p class="note">This folder has no music or sub-folders.</p>');
  const so=document.createElement('button');so.className='mini';so.style.marginTop='12px';so.textContent='Sign out';
  so.onclick=()=>{A.pause();S=null;save(null);tracks=[];idx=-1;draw();showLogin()};
  lib.append(so);
}

function row(n,t,fn){
  const d=document.createElement('div');d.className='row';d.tabIndex=0;d.setAttribute('role','button');
  d.innerHTML=`<i>${n}</i><span></span>`;d.lastChild.textContent=t;
  d.onclick=fn;d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}};
  return d;
}

const cur=()=>tracks[idx]||{name:''};
function draw(){
  const has=tracks.length>0;
  $('#disc').classList.toggle('empty',!has);
  $('#lab').textContent=has?disc:'No disc';
  $('#trk').textContent=has?`T${pad(idx+1)}/${pad(tracks.length)}`:'T--/--';
  $('#seek').disabled=!has;
  updateSeekFill();
}

async function playIdx(i){
  if(!unlocked){A.src=SILENT;A.play().catch(()=>{});unlocked=true}
  idx=i;draw();say('Reading disc…');
  try{
    const j=await api('files/get_temporary_link',{path:cur().path_lower});
    A.src=j.link;
    await A.play();
    say(clean(cur().name));
    if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:clean(cur().name),album:disc,artist:'TK-100'});
    drawLib();
  }catch(e){say('Error: '+e.message)}
}

function step(d){
  if(!tracks.length)return;
  if(shuffle&&tracks.length>1){let n;do{n=Math.floor(Math.random()*tracks.length)}while(n===idx);playIdx(n);return}
  const n=idx+d;
  if(n>=0&&n<tracks.length)playIdx(n);else if(d>0){A.pause();A.currentTime=0;say('End of disc')}
}

$('#pp').onclick=()=>{
  if(!tracks.length){say('Pick a track below');return}
  if(A.paused&&A.src&&!A.src.startsWith('data:'))A.play();
  else if(A.paused)playIdx(Math.max(idx,0));
  else A.pause();
};
$('#next').onclick=()=>step(1);
$('#prev').onclick=()=>{if(A.currentTime>3)A.currentTime=0;else step(-1)};
$('#stop').onclick=()=>{A.pause();A.currentTime=0;updateSeekFill();say(tracks.length?clean(cur().name):'No disc')};
$('#shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.setAttribute('aria-pressed',shuffle)};
$('#eject').onclick=()=>{A.pause();A.removeAttribute('src');tracks=[];idx=-1;disc='';draw();$('#time').textContent='--:--';$('#seek').value=0;updateSeekFill();say('Disc ejected');if(S){stack=[{path:'',name:'Library'}];openFolder('')}};
$('#seek').oninput=e=>{if(isFinite(A.duration))A.currentTime=e.target.value/1000*A.duration;updateSeekFill()};

A.onplay=()=>{$('#disc').classList.add('on');$('#ppi').innerHTML=IC.pause;$('#pp').setAttribute('aria-label','Pause')};
A.onpause=()=>{$('#disc').classList.remove('on');$('#ppi').innerHTML=IC.play;$('#pp').setAttribute('aria-label','Play')};
A.ontimeupdate=()=>{
  if(A.src.startsWith('data:'))return;
  $('#time').textContent=fmt(A.currentTime);
  if(isFinite(A.duration)){$('#seek').value=A.currentTime/A.duration*1000;updateSeekFill()}
};
A.onended=()=>step(1);
A.onerror=()=>{if(!A.src.startsWith('data:'))say('Cannot play this file')};
if('mediaSession' in navigator){
  const m=navigator.mediaSession;
  m.setActionHandler('play',()=>A.play());m.setActionHandler('pause',()=>A.pause());
  m.setActionHandler('nexttrack',()=>step(1));m.setActionHandler('previoustrack',()=>step(-1));
}

S=load();
if(S&&S.token){
  stack=[{path:'',name:'Library'},{path:'/music',name:'Music'}];
  draw();
  openFolder('/music');
}else{
  draw();
  showLogin();
}
</script>
</body>
</html>
