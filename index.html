<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>TK-100 Compact Disc Player</title>
<script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.5/dist/jsmediatags.min.js"></script>
<style>
  :root {
    --bg: #0b0b0c;
    --panel: #161619;
    --panel-2: #1f1f24;
    --ink: #f3f3f5;
    --muted: #9898a2;
    --accent: #ff5a1f;
    --accent-soft: rgba(255, 90, 31, 0.16);
    --line: rgba(255, 255, 255, 0.08);
    --lcd-bg: #090a08;
    --lcd-ink: #ffb347;
    --radius: 22px;
    --space: clamp(14px, 3vw, 24px);
    --tap: 46px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: radial-gradient(circle at top, #18181d 0%, var(--bg) 62%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding:
      max(14px, env(safe-area-inset-top))
      max(14px, env(safe-area-inset-right))
      max(20px, env(safe-area-inset-bottom))
      max(14px, env(safe-area-inset-left));
    gap: 14px;
  }

  .deck {
    width: 100%;
    max-width: 440px;
    background: linear-gradient(180deg, var(--panel) 0%, #111114 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: var(--space);
    box-shadow:
      0 24px 60px rgba(0, 0, 0, 0.65),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
    display: flex;
    flex-direction: column;
    gap: var(--space);
    position: relative;
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .led {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    flex: 0 0 auto;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pill-btn {
    min-height: 36px;
    padding: 0 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--ink);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.12s ease;
  }

  .pill-btn:active {
    transform: scale(0.97);
  }

  .pill-btn.active {
    background: var(--accent-soft);
    border-color: rgba(255, 90, 31, 0.55);
    color: #ff9870;
  }

  /* Optical Disc Bay Window (Portrait / Vertical) */
  .well {
    position: relative;
    background: radial-gradient(circle at center, #1b1b20 0%, #0d0d10 62%, #060608 100%);
    border-radius: 50%;
    padding: 12px;
    width: 100%;
    max-width: 390px;
    margin: 0 auto;
    overflow: hidden;
    box-shadow:
      inset 0 14px 32px rgba(0, 0, 0, 0.98),
      inset 0 0 0 2px #2c2c32,
      0 1px 0 rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1;
  }

  /* Tray & Spindle visible inside empty optical well */
  .well::before {
    content: "";
    position: absolute;
    inset: 14px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.05);
    background: radial-gradient(circle at center, rgba(255, 255, 255, 0.025) 0%, transparent 72%);
    pointer-events: none;
    z-index: 0;
  }

  .spindle {
    position: absolute;
    z-index: 1;
    width: 22%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at center, #0e0e11 32%, #4a4f58 36%, #23262b 62%, #121215 100%);
    box-shadow:
      inset 0 2px 6px rgba(0, 0, 0, 0.9),
      0 0 0 1px rgba(255, 255, 255, 0.08);
    pointer-events: none;
  }

  .disc {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 318px;
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at center, transparent 28%, rgba(255, 255, 255, 0.04) 29%, transparent 30%, rgba(255, 255, 255, 0.03) 45%, transparent 46%, rgba(255, 255, 255, 0.04) 62%, transparent 63%),
      conic-gradient(
        from 35deg,
        #c8ced6 0deg,
        #7d8590 45deg,
        #e2e8f0 90deg,
        #64748b 135deg,
        #cbd5e1 180deg,
        #475569 225deg,
        #f1f5f9 270deg,
        #64748b 315deg,
        #c8ced6 360deg
      );
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.85), inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    transition: width 0.35s ease, max-width 0.35s ease, filter 0.35s ease, opacity 0.35s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .disc.mini-cd {
    width: 170px;
    max-width: 170px;
  }

  .disc.empty {
    opacity: 0;
    transform: translateX(115%);
    pointer-events: none;
  }

  .disc.inserting {
    animation: discInsert 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .disc.ejecting {
    animation: discEject 0.9s cubic-bezier(0.4, 0, 0.8, 0.6) forwards;
  }

  @keyframes discInsert {
    0% {
      opacity: 0;
      transform: translateX(115%);
    }
    100% {
      opacity: 1;
      transform: translateX(0);
    }
  }

  @keyframes discEject {
    0% {
      opacity: 1;
      transform: translateX(0);
    }
    100% {
      opacity: 0;
      transform: translateX(115%);
    }
  }

  #disc-rotor {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    will-change: transform;
  }

  #disc-art {
    position: absolute;
    inset: 14%;
    border-radius: 50%;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .disc.has-art #disc-art {
    opacity: 0.72;
  }

  #lab {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20%;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.82);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    pointer-events: none;
  }

  .hub {
    position: relative;
    z-index: 2;
    width: 24%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, #18181c 48%, #8e96a0 51%, #3b4048 72%, #141418 100%);
    box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.65), inset 0 0 6px rgba(255, 255, 255, 0.25);
  }

  /* OLED Screen */
  .lcd {
    background: var(--lcd-bg);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 64px;
    box-shadow: inset 0 4px 16px rgba(0, 0, 0, 0.9);
  }

  .lcd-left {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  #trk {
    font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--lcd-ink);
    letter-spacing: 0.08em;
    opacity: 0.85;
  }

  #msg {
    font-size: 13px;
    font-weight: 500;
    color: var(--lcd-ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #time {
    font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
    font-size: 16px;
    font-weight: 600;
    color: var(--lcd-ink);
    letter-spacing: 0.06em;
    align-self: center;
    line-height: 1;
    flex: 0 0 auto;
  }

  /* Scrubber */
  .seek-wrap {
    display: flex;
    align-items: center;
    padding: 2px 0;
  }

  input[type="range"]#seek {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 28px;
    background: transparent;
    cursor: pointer;
    margin: 0;
  }

  input[type="range"]#seek::-webkit-slider-runnable-track {
    height: 5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.14);
  }

  input[type="range"]#seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    margin-top: -5.5px;
    box-shadow: 0 0 10px rgba(255, 90, 31, 0.65);
  }

  input[type="range"]#seek::-moz-range-track {
    height: 5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.14);
  }

  input[type="range"]#seek::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(255, 90, 31, 0.65);
  }

  /* Transport Controls */
  .transport {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .t-btn {
    height: var(--tap);
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
  }

  .t-btn:active {
    transform: scale(0.96);
  }

  .t-btn.primary {
    background: var(--accent);
    border-color: rgba(255, 255, 255, 0.15);
    color: #fff;
    box-shadow: 0 8px 20px rgba(255, 90, 31, 0.35);
  }

  /* Shuffle, Repeat, Eject — icon-only, 200% extended width (3x base), unchanged 30px height, horizontally centered */
  .tools {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: nowrap;
  }

  .tools .mini {
    width: 132px;
    height: 30px;
    padding: 0;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex: 0 0 auto;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }

  .tools .mini:active {
    transform: scale(0.97);
  }

  .tools .mini.on {
    background: var(--accent-soft);
    border-color: rgba(255, 90, 31, 0.55);
    color: var(--accent);
  }

  /* Library Drawer */
  section.lib {
    display: none;
    flex-direction: column;
    gap: 10px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }

  section.lib.open {
    display: flex;
  }

  .lib-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .crumbs {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    min-width: 0;
    flex: 1;
  }

  .crumb {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    max-width: 170px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .crumb.current {
    color: var(--ink);
    border-color: rgba(255, 255, 255, 0.22);
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 290px;
    overflow-y: auto;
    padding-right: 2px;
  }

  .row {
    width: 100%;
    min-height: var(--tap);
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.02);
    color: var(--ink);
    font-size: 13px;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    cursor: pointer;
  }

  .row:hover {
    background: rgba(255, 255, 255, 0.05);
  }

  .row-title {
    min-width: 0;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row-meta {
    font-size: 11px;
    color: var(--muted);
    flex: 0 0 auto;
  }

  .row.playing {
    border-color: rgba(255, 90, 31, 0.55);
    background: var(--accent-soft);
    color: #ffa37e;
  }

  .empty-state {
    padding: 18px 12px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }

  /* Copyright Footer below Library Drawer */
  .copyright-footer {
    width: 100%;
    max-width: 440px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--muted);
    padding: 2px 8px 6px;
  }

  /* TV / Ambient Mode */
  body.tv-mode {
    background: #000000;
    justify-content: center;
  }

  body.tv-mode .deck {
    background: #000000;
    border-color: transparent;
    box-shadow: none;
    max-width: 640px;
    width: 100%;
    align-items: center;
    justify-content: center;
  }

  body.tv-mode .top .brand span {
    display: none;
  }

  body.tv-mode .top-actions > :not(#tv-mode),
  body.tv-mode .lcd,
  body.tv-mode .seek-wrap,
  body.tv-mode .transport,
  body.tv-mode .tools,
  body.tv-mode section.lib,
  body.tv-mode .copyright-footer {
    display: none !important;
  }

  body.tv-mode .well {
    max-width: min(74vw, 74vh, 460px);
    background: #040405;
    box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.95);
  }

  /* Landscape Layout (Mobile Landscape & Desktop/Web Landscape) */
  @media (orientation: landscape) and (max-height: 760px) {
    .deck {
      --land-cd: clamp(230px, 72vh, 342px);
      max-width: min(820px, 95vw);
      width: 100%;
      display: grid;
      grid-template-columns: var(--land-cd) minmax(0, 1fr);
      grid-template-rows: auto auto auto auto auto;
      gap: clamp(10px, 2.2vh, 18px) clamp(16px, 3vw, 24px);
      align-items: center;
      padding: clamp(14px, 2.6vh, 22px);
    }

    .well {
      grid-column: 1;
      grid-row: 1 / span 5;
      width: var(--land-cd);
      max-width: var(--land-cd);
      margin: 0;
    }

    .top {
      grid-column: 2;
      grid-row: 1;
    }

    .lcd {
      grid-column: 2;
      grid-row: 2;
    }

    .seek-wrap {
      grid-column: 2;
      grid-row: 3;
    }

    .transport {
      grid-column: 2;
      grid-row: 4;
    }

    .tools {
      grid-column: 2;
      grid-row: 5;
    }

    section.lib {
      grid-column: 1 / -1;
      grid-row: 6;
    }
  }
</style>
</head>
<body>
  <main class="deck" id="deck">
    <header class="top">
      <div class="brand">
        <span class="led" aria-hidden="true"></span>
        <span>TK-100</span>
      </div>
      <div class="top-actions">
        <button class="pill-btn" id="tv-mode" type="button" title="TV Mode">TV Mode</button>
        <button class="pill-btn" id="lib-toggle" type="button">Library</button>
      </div>
    </header>

    <div class="well">
      <div class="spindle" aria-hidden="true"></div>
      <div class="disc empty" id="disc">
        <div id="disc-rotor">
          <div id="disc-art"></div>
          <div id="lab"></div>
        </div>
        <div class="hub"></div>
      </div>
    </div>

    <div class="lcd" role="status" aria-live="polite">
      <div class="lcd-left">
        <div id="trk">T--/--</div>
        <div id="msg">Choose a CD folder</div>
      </div>
      <div id="time">--:--</div>
    </div>

    <div class="seek-wrap">
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek position" />
    </div>

    <div class="transport">
      <button class="t-btn" id="prev" type="button" aria-label="Previous track">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
        </svg>
      </button>
      <button class="t-btn primary" id="pp" type="button" aria-label="Play or pause">
        <svg id="ppi" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z" />
        </svg>
      </button>
      <button class="t-btn" id="next" type="button" aria-label="Next track">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
        </svg>
      </button>
      <button class="t-btn" id="stop" type="button" aria-label="Stop playback">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 6h12v12H6z" />
        </svg>
      </button>
    </div>

    <div class="tools">
      <button class="mini" id="shuf" type="button" aria-label="Shuffle" title="Shuffle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8" />
          <line x1="4" y1="20" x2="21" y2="3" />
          <polyline points="21 16 21 21 16 21" />
          <line x1="15" y1="15" x2="21" y2="21" />
          <line x1="4" y1="4" x2="9" y2="9" />
        </svg>
      </button>
      <button class="mini" id="rep" type="button" aria-label="Repeat" title="Repeat">
        <span id="rep-icon" style="display:inline-flex;align-items:center;gap:2px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9" />
            <path d="M3 11V9a4 4 0 0 1 4-4h14" />
            <polyline points="7 23 3 19 7 15" />
            <path d="M21 13v2a4 4 0 0 1-4 4H3" />
          </svg>
        </span>
      </button>
      <button class="mini" id="eject" type="button" aria-label="Eject disc" title="Eject">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 5L5 14h14L12 5zm-7 11h14v2H5v-2z" />
        </svg>
      </button>
    </div>

    <section class="lib" id="lib">
      <div class="lib-bar">
        <div class="crumbs" id="crumbs"></div>
        <button class="crumb" id="auth-btn" type="button">Connect</button>
      </div>
      <div class="list" id="list"></div>
    </section>
  </main>

  <footer class="copyright-footer">
    © TK-100 DIGITAL AUDIO. ALL RIGHTS RESERVED.
  </footer>

  <audio id="audio" preload="metadata"></audio>

<script>
(() => {
  // Replace with your Dropbox App Key (PKCE)
  const CLIENT_ID = "YOUR_DROPBOX_APP_KEY";
  const REDIRECT_URI = window.location.origin + window.location.pathname;
  const AUTH_STORAGE_KEY = "tk_dbx_auth";
  const VERIFIER_KEY = "tk_dbx_pkce_verifier";
  const AUDIO_EXTS = [".mp3", ".flac", ".m4a", ".aac", ".wav", ".ogg"];
  const COVER_NAMES = ["cover.jpg", "cover.jpeg", "cover.png", "folder.jpg", "folder.png", "front.jpg", "front.png"];

  const audio = document.getElementById("audio");
  const discEl = document.getElementById("disc");
  const rotorEl = document.getElementById("disc-rotor");
  const artEl = document.getElementById("disc-art");
  const labEl = document.getElementById("lab");
  const trkEl = document.getElementById("trk");
  const msgEl = document.getElementById("msg");
  const timeEl = document.getElementById("time");
  const seekEl = document.getElementById("seek");
  const ppBtn = document.getElementById("pp");
  const ppiEl = document.getElementById("ppi");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  const stopBtn = document.getElementById("stop");
  const shufBtn = document.getElementById("shuf");
  const repBtn = document.getElementById("rep");
  const repIconEl = document.getElementById("rep-icon");
  const ejectBtn = document.getElementById("eject");
  const tvBtn = document.getElementById("tv-mode");
  const libToggle = document.getElementById("lib-toggle");
  const libEl = document.getElementById("lib");
  const crumbsEl = document.getElementById("crumbs");
  const listEl = document.getElementById("list");
  const authBtn = document.getElementById("auth-btn");

  let S = loadAuth();
  let stack = [{ path: "", name: "TK_MusicPlayer" }];
  let currentEntries = [];
  let tracks = [];
  let disc = "";
  let currentAlbumPath = "";
  let idx = -1;
  let shuffle = false;
  let repeatMode = "off"; // 'off' | 'all' | 'one'
  let isSeeking = false;

  // Disc spin state
  let spinAngle = 0;
  let lastFrameTime = null;
  let rafId = null;

  // Async & tray guards
  let playSessionId = 0;
  let folderSessionId = 0;
  let pendingTrayRequest = null;
  let isAnimatingDisc = false;
  const linkCache = new Map();
  const coverCache = new Map();

  function loadAuth() {
    try {
      const raw = localStorage.getItem(AUTH_STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  }

  function saveAuth(data) {
    S = data;
    try {
      if (data) localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(data));
      else localStorage.removeItem(AUTH_STORAGE_KEY);
    } catch {}
    updateAuthUi();
  }

  function updateAuthUi() {
    authBtn.textContent = S && S.token ? "Reconnect" : "Connect";
  }

  function base64UrlEncode(buf) {
    return btoa(String.fromCharCode(...new Uint8Array(buf)))
      .replace(/\+/g, "-")
      .replace(/\//g, "_")
      .replace(/=+$/, "");
  }

  async function generatePKCE() {
    const verifierBytes = crypto.getRandomValues(new Uint8Array(32));
    const verifier = base64UrlEncode(verifierBytes);
    const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
    const challenge = base64UrlEncode(digest);
    return { verifier, challenge };
  }

  async function startAuth() {
    if (!CLIENT_ID || CLIENT_ID === "YOUR_DROPBOX_APP_KEY") {
      setStatus("Set CLIENT_ID in index.html");
      libEl.classList.add("open");
      return;
    }
    const { verifier, challenge } = await generatePKCE();
    sessionStorage.setItem(VERIFIER_KEY, verifier);
    const params = new URLSearchParams({
      client_id: CLIENT_ID,
      response_type: "code",
      code_challenge: challenge,
      code_challenge_method: "S256",
      token_access_type: "offline",
      redirect_uri: REDIRECT_URI
    });
    window.location.href = `https://www.dropbox.com/oauth2/authorize?${params.toString()}`;
  }

  async function exchangeCodeForToken(code) {
    const verifier = sessionStorage.getItem(VERIFIER_KEY);
    sessionStorage.removeItem(VERIFIER_KEY);
    if (!verifier) return;

    const body = new URLSearchParams({
      code,
      grant_type: "authorization_code",
      client_id: CLIENT_ID,
      redirect_uri: REDIRECT_URI,
      code_verifier: verifier
    });

    const res = await fetch("https://api.dropboxapi.com/oauth2/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString()
    });
    if (!res.ok) throw new Error("Token exchange failed");
    const json = await res.json();
    saveAuth({
      token: json.access_token,
      refresh_token: json.refresh_token || (S && S.refresh_token) || null
    });
  }

  async function refreshAccessToken() {
    if (!S || !S.refresh_token) {
      saveAuth(null);
      throw new Error("Authentication required");
    }
    const body = new URLSearchParams({
      grant_type: "refresh_token",
      refresh_token: S.refresh_token,
      client_id: CLIENT_ID
    });
    const res = await fetch("https://api.dropboxapi.com/oauth2/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString()
    });
    if (!res.ok) {
      saveAuth(null);
      throw new Error("Session expired");
    }
    const json = await res.json();
    saveAuth({
      token: json.access_token,
      refresh_token: S.refresh_token
    });
    return S.token;
  }

  async function dbxRpc(endpoint, payload, retry = true) {
    if (!S || !S.token) throw new Error("Not connected to Dropbox");
    const res = await fetch(`https://api.dropboxapi.com/2/${endpoint}`, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${S.token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });
    if (res.status === 401 && retry) {
      await refreshAccessToken();
      return dbxRpc(endpoint, payload, false);
    }
    if (!res.ok) throw new Error(`Dropbox error (${res.status})`);
    return res.json();
  }

  function hasAudioExt(name = "") {
    const lower = name.toLowerCase();
    return AUDIO_EXTS.some((ext) => lower.endsWith(ext));
  }

  function naturalSort(a, b) {
    return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
  }

  function formatTime(sec) {
    if (!Number.isFinite(sec) || sec < 0) return "--:--";
    const total = Math.floor(sec);
    const m = Math.floor(total / 60);
    const s = total % 60;
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  function setStatus(text) {
    msgEl.textContent = text;
  }

  function updateTrackDisplay() {
    if (!tracks.length || idx < 0) {
      trkEl.textContent = "T--/--";
      return;
    }
    const miniTag = tracks.length <= 4 ? " [8cm Single]" : "";
    trkEl.textContent = `T${String(idx + 1).padStart(2, "0")}/${String(tracks.length).padStart(2, "0")}${miniTag}`;
  }

  function updatePlayIcon() {
    const playing = !audio.paused && !!audio.src;
    ppiEl.innerHTML = playing
      ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z" />'
      : '<path d="M8 5v14l11-7z" />';
    if (playing) startSpin();
    else stopSpin();
    updateMediaSessionState();
  }

  function startSpin() {
    if (rafId !== null) return;
    lastFrameTime = performance.now();
    const tick = (now) => {
      const dt = now - lastFrameTime;
      lastFrameTime = now;
      spinAngle = (spinAngle + dt * 0.06) % 360;
      rotorEl.style.transform = `rotate(${spinAngle}deg)`;
      rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);
  }

  function stopSpin() {
    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
    lastFrameTime = null;
  }

  function setDiscArtwork(url) {
    if (url) {
      artEl.style.backgroundImage = `url("${url}")`;
      discEl.classList.add("has-art");
    } else {
      artEl.style.backgroundImage = "";
      discEl.classList.remove("has-art");
    }
  }

  function runDiscAnimation(type, callback) {
    isAnimatingDisc = true;
    discEl.classList.remove("empty", "inserting", "ejecting");
    void discEl.offsetWidth;
    discEl.classList.add(type);

    const onEnd = () => {
      discEl.removeEventListener("animationend", onEnd);
      discEl.classList.remove(type);
      if (type === "ejecting") {
        discEl.classList.add("empty");
      }
      isAnimatingDisc = false;
      if (callback) callback();
      if (pendingTrayRequest) {
        const nextReq = pendingTrayRequest;
        pendingTrayRequest = null;
        nextReq();
      }
    };
    discEl.addEventListener("animationend", onEnd);
  }

  function loadDiscIntoTray({ title, folderPath, folderTracks, folderEntries, autoPlayIndex = -1 }) {
    const execute = () => {
      disc = title;
      currentAlbumPath = folderPath;
      tracks = folderTracks;
      idx = folderTracks.length ? (autoPlayIndex >= 0 ? autoPlayIndex : 0) : -1;

      labEl.textContent = title;
      discEl.classList.toggle("mini-cd", folderTracks.length > 0 && folderTracks.length <= 4);
      setDiscArtwork(null);
      updateTrackDisplay();

      runDiscAnimation("inserting", async () => {
        resolveAlbumArtwork(folderPath, folderEntries, folderTracks);
        if (autoPlayIndex >= 0 && tracks[autoPlayIndex]) {
          await playTrackAt(autoPlayIndex);
        } else {
          setStatus(title || "Disc Ready");
          timeEl.textContent = tracks.length ? "00:00" : "--:--";
        }
      });
    };

    if (isAnimatingDisc) {
      pendingTrayRequest = execute;
      return;
    }

    if (!discEl.classList.contains("empty")) {
      runDiscAnimation("ejecting", execute);
    } else {
      execute();
    }
  }

  async function resolveAlbumArtwork(folderPath, entries, albumTracks) {
    if (coverCache.has(folderPath)) {
      setDiscArtwork(coverCache.get(folderPath));
      return;
    }

    const coverFile = (entries || []).find((e) => e[".tag"] === "file" && COVER_NAMES.includes(e.name.toLowerCase()));
    if (coverFile) {
      try {
        const url = await getTempLink(coverFile.path_lower || coverFile.path_display);
        coverCache.set(folderPath, url);
        if (currentAlbumPath === folderPath) setDiscArtwork(url);
        return;
      } catch {}
    }

    const firstAudio = albumTracks && albumTracks[0];
    if (firstAudio && window.jsmediatags) {
      try {
        const url = await getTempLink(firstAudio.path_lower || firstAudio.path_display);
        const res = await fetch(url, { headers: { Range: "bytes=0-262143" } });
        const buf = await res.arrayBuffer();
        window.jsmediatags.read(new Blob([buf]), {
          onSuccess: (tag) => {
            const pic = tag.tags && tag.tags.picture;
            if (pic && pic.data) {
              const bytes = new Uint8Array(pic.data);
              let binary = "";
              for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
              const dataUrl = `data:${pic.format || "image/jpeg"};base64,${btoa(binary)}`;
              coverCache.set(folderPath, dataUrl);
              if (currentAlbumPath === folderPath) setDiscArtwork(dataUrl);
            }
          },
          onError: () => {}
        });
      } catch {}
    }
  }

  async function getTempLink(path) {
    if (linkCache.has(path)) return linkCache.get(path);
    const data = await dbxRpc("files/get_temporary_link", { path });
    linkCache.set(path, data.link);
    return data.link;
  }

  function prefetchNextTrack(currentIndex) {
    const nextIdx = currentIndex + 1;
    if (nextIdx >= 0 && nextIdx < tracks.length) {
      const t = tracks[nextIdx];
      getTempLink(t.path_lower || t.path_display).catch(() => {});
    }
  }

  function haltPlayback(resetPosition = true) {
    playSessionId++;
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    if (resetPosition) {
      seekEl.value = 0;
      timeEl.textContent = tracks.length ? "00:00" : "--:--";
    }
    updatePlayIcon();
  }

  async function playTrackAt(targetIdx) {
    if (!tracks.length || targetIdx < 0 || targetIdx >= tracks.length) return;
    const session = ++playSessionId;
    idx = targetIdx;
    const track = tracks[idx];
    updateTrackDisplay();
    renderList();
    setStatus(track.name.replace(/\.[^/.]+$/, ""));
    seekEl.value = 0;
    timeEl.textContent = "00:00";

    try {
      const link = await getTempLink(track.path_lower || track.path_display);
      if (session !== playSessionId) return;
      audio.src = link;
      await audio.play();
      if (session !== playSessionId) return;
      updatePlayIcon();
      updateMediaSessionMetadata(track);
      prefetchNextTrack(idx);
    } catch (err) {
      if (session !== playSessionId) return;
      setStatus(err.message || "Playback failed");
      updatePlayIcon();
    }
  }

  function pickNextIndex(fromEnd = false) {
    if (!tracks.length) return -1;
    if (shuffle && tracks.length > 1) {
      let next = Math.floor(Math.random() * tracks.length);
      if (next === idx) next = (idx + 1) % tracks.length;
      return next;
    }
    if (idx + 1 < tracks.length) return idx + 1;
    if (repeatMode === "all") return 0;
    return fromEnd ? -1 : 0;
  }

  function pickPrevIndex() {
    if (!tracks.length) return -1;
    if (shuffle && tracks.length > 1) {
      let prev = Math.floor(Math.random() * tracks.length);
      if (prev === idx) prev = (idx - 1 + tracks.length) % tracks.length;
      return prev;
    }
    if (idx - 1 >= 0) return idx - 1;
    return repeatMode === "all" ? tracks.length - 1 : 0;
  }

  async function openFolder(path, name) {
    const session = ++folderSessionId;
    if (!S || !S.token) {
      renderCrumbs();
      listEl.innerHTML = '<div class="empty-state">Connect Dropbox to browse your music folders.</div>';
      return;
    }
    setStatus("Loading folder...");
    listEl.innerHTML = '<div class="empty-state">Loading...</div>';

    try {
      const res = await dbxRpc("files/list_folder", { path });
      if (session !== folderSessionId) return;
      currentEntries = res.entries || [];
      renderCrumbs();
      renderList();
      setStatus(disc || "Choose a CD folder");
    } catch (err) {
      if (session !== folderSessionId) return;
      listEl.innerHTML = `<div class="empty-state">${err.message}</div>`;
      setStatus(err.message);
    }
  }

  function renderCrumbs() {
    crumbsEl.innerHTML = "";
    stack.forEach((node, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "crumb" + (i === stack.length - 1 ? " current" : "");
      btn.textContent = node.name;
      btn.addEventListener("click", () => {
        if (i === stack.length - 1) return;
        stack = stack.slice(0, i + 1);
        openFolder(node.path, node.name);
      });
      crumbsEl.appendChild(btn);
    });
  }

  function renderList() {
    const folders = currentEntries.filter((e) => e[".tag"] === "folder").sort(naturalSort);
    const folderTracks = currentEntries.filter((e) => e[".tag"] === "file" && hasAudioExt(e.name)).sort(naturalSort);
    listEl.innerHTML = "";

    if (!folders.length && !folderTracks.length) {
      listEl.innerHTML = '<div class="empty-state">No folders or audio tracks here.</div>';
      return;
    }

    folders.forEach((f) => {
      const row = document.createElement("button");
      row.type = "button";
      row.className = "row";
      row.innerHTML = `<span class="row-title">📁 ${escapeHtml(f.name)}</span><span class="row-meta">FOLDER</span>`;
      row.addEventListener("click", async () => {
        stack.push({ path: f.path_lower || f.path_display, name: f.name });
        await openFolder(f.path_lower || f.path_display, f.name);
        const subAudio = currentEntries.filter((e) => e[".tag"] === "file" && hasAudioExt(e.name)).sort(naturalSort);
        if (subAudio.length) {
          haltPlayback(true);
          loadDiscIntoTray({
            title: f.name,
            folderPath: f.path_lower || f.path_display,
            folderTracks: subAudio,
            folderEntries: currentEntries,
            autoPlayIndex: -1
          });
        }
      });
      listEl.appendChild(row);
    });

    folderTracks.forEach((t, tIdx) => {
      const activeFolder = (stack[stack.length - 1]?.path || "") === currentAlbumPath;
      const isCurrent = activeFolder && tIdx === idx;
      const row = document.createElement("button");
      row.type = "button";
      row.className = "row" + (isCurrent ? " playing" : "");
      row.innerHTML = `<span class="row-title">${escapeHtml(t.name.replace(/\.[^/.]+$/, ""))}</span><span class="row-meta">${String(tIdx + 1).padStart(2, "0")}</span>`;
      row.addEventListener("click", () => {
        const curNode = stack[stack.length - 1];
        const albumTitle = curNode ? curNode.name : "Disc";
        const albumPath = curNode ? curNode.path : "";
        if (currentAlbumPath !== albumPath || tracks.length !== folderTracks.length) {
          haltPlayback(true);
          loadDiscIntoTray({
            title: albumTitle,
            folderPath: albumPath,
            folderTracks,
            folderEntries: currentEntries,
            autoPlayIndex: tIdx
          });
        } else {
          playTrackAt(tIdx);
        }
      });
      listEl.appendChild(row);
    });
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function updateRepeatUi() {
    repBtn.classList.toggle("on", repeatMode !== "off");
    const badge = repeatMode === "one"
      ? '<span style="font-size:10px;font-weight:800;line-height:1;">1</span>'
      : "";
    repIconEl.innerHTML = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="17 1 21 5 17 9" />
        <path d="M3 11V9a4 4 0 0 1 4-4h14" />
        <polyline points="7 23 3 19 7 15" />
        <path d="M21 13v2a4 4 0 0 1-4 4H3" />
      </svg>${badge}`;
  }

  // MediaSession setup (track controls over ±10s skip)
  function initMediaSession() {
    if (!("mediaSession" in navigator)) return;
    navigator.mediaSession.setActionHandler("seekbackward", null);
    navigator.mediaSession.setActionHandler("seekforward", null);

    navigator.mediaSession.setActionHandler("play", async () => {
      if (!audio.src && tracks.length) {
        await playTrackAt(idx >= 0 ? idx : 0);
      } else if (audio.src) {
        await audio.play();
        updatePlayIcon();
      }
    });

    navigator.mediaSession.setActionHandler("pause", () => {
      audio.pause();
      updatePlayIcon();
    });

    navigator.mediaSession.setActionHandler("stop", () => {
      haltPlayback(true);
      setStatus(disc || "Stopped");
    });

    navigator.mediaSession.setActionHandler("previoustrack", () => {
      prevBtn.click();
    });

    navigator.mediaSession.setActionHandler("nexttrack", () => {
      nextBtn.click();
    });

    navigator.mediaSession.setActionHandler("seekto", (details) => {
      if (typeof details.seekTime === "number" && Number.isFinite(audio.duration)) {
        audio.currentTime = Math.max(0, Math.min(details.seekTime, audio.duration));
        updateMediaSessionState();
      }
    });
  }

  function updateMediaSessionMetadata(track) {
    if (!("mediaSession" in navigator) || !track) return;
    const artwork = coverCache.get(currentAlbumPath)
      ? [{ src: coverCache.get(currentAlbumPath), sizes: "512x512", type: "image/jpeg" }]
      : [];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.name.replace(/\.[^/.]+$/, ""),
      artist: "TK-100 Compact Disc",
      album: disc || "Compact Disc",
      artwork
    });
  }

  function updateMediaSessionState() {
    if (!("mediaSession" in navigator)) return;
    navigator.mediaSession.playbackState = !audio.paused && audio.src ? "playing" : "paused";
    if (Number.isFinite(audio.duration) && audio.duration > 0 && "setPositionState" in navigator.mediaSession) {
      try {
        navigator.mediaSession.setPositionState({
          duration: audio.duration,
          playbackRate: audio.playbackRate || 1,
          position: Math.min(audio.currentTime || 0, audio.duration)
        });
      } catch {}
    }
  }

  // Event listeners
  libToggle.addEventListener("click", () => {
    const opening = !libEl.classList.contains("open");
    libEl.classList.toggle("open", opening);
    if (opening && !currentEntries.length) {
      const top = stack[stack.length - 1] || { path: "", name: "TK_MusicPlayer" };
      openFolder(top.path, top.name);
    }
  });

  authBtn.addEventListener("click", startAuth);

  tvBtn.addEventListener("click", () => {
    const active = document.body.classList.toggle("tv-mode");
    tvBtn.classList.toggle("active", active);
    if (active) libEl.classList.remove("open");
  });

  ppBtn.addEventListener("click", async () => {
    if (!audio.src) {
      if (tracks.length) {
        await playTrackAt(idx >= 0 ? idx : 0);
      } else {
        const curNode = stack[stack.length - 1];
        const folderAudio = currentEntries.filter((e) => e[".tag"] === "file" && hasAudioExt(e.name)).sort(naturalSort);
        if (folderAudio.length && curNode) {
          loadDiscIntoTray({
            title: curNode.name,
            folderPath: curNode.path,
            folderTracks: folderAudio,
            folderEntries: currentEntries,
            autoPlayIndex: 0
          });
        } else {
          libEl.classList.add("open");
          setStatus("Choose a CD folder");
        }
      }
      return;
    }

    if (audio.paused) {
      await audio.play();
      updatePlayIcon();
    } else {
      audio.pause();
      updatePlayIcon();
    }
  });

  prevBtn.addEventListener("click", async () => {
    if (!tracks.length) return;
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      return;
    }
    const prevIdx = pickPrevIndex();
    if (prevIdx >= 0) await playTrackAt(prevIdx);
  });

  nextBtn.addEventListener("click", async () => {
    if (!tracks.length) return;
    const nextIdx = pickNextIndex(false);
    if (nextIdx >= 0) await playTrackAt(nextIdx);
  });

  stopBtn.addEventListener("click", () => {
    haltPlayback(true);
    setStatus(disc || "Stopped");
  });

  shufBtn.addEventListener("click", () => {
    shuffle = !shuffle;
    shufBtn.classList.toggle("on", shuffle);
  });

  repBtn.addEventListener("click", () => {
    repeatMode = repeatMode === "off" ? "all" : repeatMode === "all" ? "one" : "off";
    updateRepeatUi();
  });

  ejectBtn.addEventListener("click", () => {
    haltPlayback(true);
    tracks = [];
    disc = "";
    currentAlbumPath = "";
    idx = -1;
    labEl.textContent = "";
    setDiscArtwork(null);
    discEl.classList.remove("mini-cd");
    updateTrackDisplay();
    timeEl.textContent = "--:--";
    setStatus("Ejected");
    runDiscAnimation("ejecting", () => {
      setStatus("Choose a CD folder");
    });
    stack = [{ path: "", name: "TK_MusicPlayer" }];
    if (libEl.classList.contains("open")) {
      openFolder("", "TK_MusicPlayer");
    }
  });

  seekEl.addEventListener("input", () => {
    isSeeking = true;
    if (Number.isFinite(audio.duration) && audio.duration > 0) {
      const previewSec = (Number(seekEl.value) / 1000) * audio.duration;
      timeEl.textContent = formatTime(previewSec);
    }
  });

  seekEl.addEventListener("change", () => {
    if (Number.isFinite(audio.duration) && audio.duration > 0) {
      audio.currentTime = (Number(seekEl.value) / 1000) * audio.duration;
      updateMediaSessionState();
    }
    isSeeking = false;
  });

  audio.addEventListener("timeupdate", () => {
    if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
    if (!isSeeking) {
      seekEl.value = String(Math.round((audio.currentTime / audio.duration) * 1000));
      timeEl.textContent = formatTime(audio.currentTime);
    }
  });

  audio.addEventListener("loadedmetadata", () => {
    updateMediaSessionState();
  });

  audio.addEventListener("ended", async () => {
    if (repeatMode === "one" && idx >= 0) {
      await playTrackAt(idx);
      return;
    }
    const nextIdx = pickNextIndex(true);
    if (nextIdx >= 0) {
      await playTrackAt(nextIdx);
    } else {
      haltPlayback(true);
      setStatus(disc || "Playback Complete");
    }
  });

  // Boot
  (async function init() {
    updateAuthUi();
    updateRepeatUi();
    initMediaSession();

    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    if (code) {
      window.history.replaceState({}, document.title, REDIRECT_URI);
      try {
        setStatus("Connecting Dropbox...");
        await exchangeCodeForToken(code);
        setStatus("Connected");
        libEl.classList.add("open");
        await openFolder("", "TK_MusicPlayer");
      } catch (err) {
        setStatus(err.message || "Auth failed");
      }
    } else if (S && S.token) {
      openFolder("", "TK_MusicPlayer").catch(() => {});
    }
  })();
})();
</script>
</body>
</html>
